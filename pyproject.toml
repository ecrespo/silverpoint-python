[project]
name = "silverpoint"
version = "0.11.0.post1"
description = "silverpoint charts from Python: notebooks, Flask, Django and static HTML, drawn by the library's own standalone script."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/silverpoint/_vendor/OFL.txt"]
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: Jupyter",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
flask = ["flask>=2.3"]
django = ["django>=4.2"]

[project.urls]
Homepage = "https://github.com/ecrespo/silverpoint-python"
Library = "https://github.com/ecrespo/silverpoint"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pandas>=2",
    "polars>=1",
    "pyarrow>=15",
    "flask>=2.3",
    "django>=4.2",
    "playwright>=1.49",
]
# delta-001: Spark inputs and the Databricks example, tested against a local Spark session (needs Java 17+).
spark = [
    "pyspark>=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silverpoint"]

[tool.hatch.build.targets.sdist]
include = ["src/silverpoint", "scripts", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/silverpoint/_vendor", "src/silverpoint/_builders.py", "src/silverpoint/_builders.pyi"]  # generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["node: needs Node 20+ on PATH", "browser: needs Playwright Chromium"]

[tool.ruff.lint.isort]
known-first-party = ["silverpoint"]
