name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The tag is the package version
        run: test "v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: uv run python scripts/vendor.py --check
      - run: node scripts/conformance.mjs
      - run: uv run pytest -m "not browser"
      - run: uv build
      - run: uv publish --trusted-publishing always
